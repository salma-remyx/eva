benchmarks:
  - name: tone_sensitivity_wasted_turns
    suite: eval/eval_wasted_turns.py
    scorer: wasted_turns_flagged_rate
    baseline: main
    metrics:
      - name: wasted_turns_flagged_rate
        direction: max
        # Fixture: 8 tone-gap conversations carrying 18 ground-truth wasted turns
        # (2-3 redundant user re-raises each). The metric flags per-conversation, so
        # achievable values are 18/18=1.0, 16/18=0.889, 15/18=0.833, ... — 0.9 forces
        # all 8 gap conversations to be flagged (one miss -> <=0.889 fails).
        # Baseline has no tone_sensitivity metric: 0/18 = 0.0.
        threshold: 0.9
        role: target
      - name: experience_metric_registry_count
        direction: min
        # Baseline src/eva/metrics/experience/__init__.py registers exactly 3 metrics
        # (conciseness, conversation_progression, turn_taking); head adds
        # tone_sensitivity (=4). <3 means the new import broke existing registrations.
        # Baseline already satisfies 3 >= 3.
        threshold: 3.0
        role: guardrail
    policy:
      guardrail_veto: true
    held_constant:
      - fixture conversation traces and ground-truth wasted-turn labels (identical across arms)
      - scripted deterministic judge responses (canned JSON per record, no real LLM)
      - mocked audio loading (load_role_audio / encode_audio_segment patched, and a mock
        llm_client.generate_text, mirroring tests/unit/metrics/experience/test_tone_sensitivity.py)
    avoid:
      - no network, real LLM, or credentialed SDK calls
      - no wall-clock timing on shared CPU (deterministic counts/rates only)
    compute:
      tier: cpu
    provenance:
      wasted_turns_flagged_rate: user_guidance
      experience_metric_registry_count: repo_test:tests/unit/metrics/experience/test_tone_sensitivity.py
      suite: synthesized
      held_constant: repo_test:tests/unit/metrics/experience/test_tone_sensitivity.py
      compute: user_guidance
      avoid: user_guidance