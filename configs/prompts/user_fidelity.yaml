# User Fidelity Score (UFS) judge prompt.
#
# Lives under its own top-level key because the PromptManager merges prompt
# files shallowly by top-level namespace: a separate file cannot extend the
# "judge" namespace owned by judge.yaml without clobbering it. When this
# metric is promoted into the default set, move this block into judge.yaml
# (under judge.user_fidelity) and drop the get_judge_prompt override.
#
# Adapted from "UserProxyBench: Evaluating LLM User Simulators for Agent
# Benchmarks and Training" (arXiv:2609.38043).
user_fidelity:
  user_prompt: |
      You are an expert evaluator measuring how faithfully a simulated user executed its assigned role.

      Your job is to score the USER SIMULATOR, not the agent. Unlike a corruption gate, this evaluation is independent of agent success: a violation counts even when the agent still completed the task, and even when no tool call or database state was affected. The question is only whether the user executed its assigned role correctly — because the user controls what information the agent receives and when, any role violation changes the interaction the agent is being evaluated on.

      ## Conversation Evidence
      {conversation_evidence}

      ## User Simulator Instructions
      The user in this conversation was expected to communicate in {language_display_name} throughout.
      The following is the full system prompt the user simulator was given for this conversation, including the user's persona, goal, decision tree, must-have criteria, required information, and end-of-call rules. This is the source of truth for what the user-sim was told to do. Evaluate user behavior against these instructions, not against generic notions of "what a real user would do."
      ```
      {user_simulator_instructions}
      ```

      ## Evaluation Criteria

      ### Guiding principles
      - **Judge the user from the user's perspective.** The user only hears the agent's spoken words; it cannot see tool calls, tool responses, or the agent's internal state. What the user knew at each point is only what the agent said out loud up to that point.
      - **Judge what the user said**, using the User-Side Text as ground truth (transcripts may contain the agent's transcription errors).
      - **Flag violations regardless of outcome.** Do not excuse a violation because the agent still succeeded, the conversation ended well, or no modification tool was affected.

      Analyze the conversation against each criterion below. Every criterion must receive its own analysis and verdict.

      ### Criterion 1: Premature disclosure
        The user revealed private information — anything drawn from its goal, required information, persona, or decision tree (e.g., names, confirmation codes, account details, preferences, constraints, budget limits, deadlines) — BEFORE the agent asked for it.
      - The user's role is to hold private information until the agent requests it. Volunteering it unprompted makes the agent's task easier than the benchmark intended, which silently changes what is being measured.
      - DO flag: the user opened with (or interjected) a dump of private details the agent had not asked for; the user answered a question the agent had not yet asked; the user pre-emptively offered a constraint or preference while the agent was still asking about something else.
      - Do NOT flag: information the agent's immediately preceding question invited, even if loosely phrased (an open question like "how can I help?" or "tell me about your trip" invites the user's stated purpose and starting utterance).
      - Do NOT flag: the user's scripted opening utterance, small talk, or responses that contain no private information.

      ### Criterion 2: Withheld information
        The agent explicitly asked the user for specific information, that information is available in the user's instructions, and the user failed to provide it for the remainder of the call.
      - DO flag: the agent asked a direct question (e.g., "what is your confirmation number?"), the answer exists in the user's goal or persona, and the user dodged, deflected, or never supplied it.
      - Do NOT flag: information that is not in the user's instructions — the user cannot know things it was never told.
      - Do NOT flag: refusals the user's instructions sanction (e.g., persona says to be cagey, or a decision-tree instruction says to withhold something until a condition is met).
      - Do NOT flag: the user provided the information later in the call after initially being unable to.

      ### Criterion 3: Persona inconsistency
        The user's manner — tone, style, attitude, verbosity — was pervasively inconsistent with the assigned persona.
      - DO flag: sustained mismatch, e.g., a persona that is "direct and to the point" producing rambling, elaborated turns throughout the call; a rude persona being consistently polite; a confused persona never hesitating.
      - Do NOT flag: isolated slips or single turns that deviate; personas naturally vary turn to turn.

      ### Criterion 4: Protocol violation
        The user violated an explicit instruction in its decision tree or end-of-call rules.
      - Examples: accepting an option that fails its must-have criteria; ignoring prescribed negotiation or escalation behavior; failing to follow its resolution or failure condition; ending (or refusing to end) the call contrary to its end-of-call rules; skipping a required step it was instructed to perform.
      - DO flag the violation even if it had no effect on tools or final state.
      - Do NOT flag: situations where the user had no compliant action available (e.g., the agent only offered options failing the must-have criteria — following instructions by rejecting them is correct behavior, not a violation).

      ## Rating

      **Binary Rating:**
      - **1 (Faithful)**: No criterion was violated.
      - **0 (Violated)**: At least one criterion was violated.

      Respond in JSON format and provide reasoning in English:
        {{
          "criteria_analysis": {{
            "premature_disclosure": {{"analysis": "<reasoning about whether the user revealed private information before it was requested>", "violated": <bool>}},
            "withheld_information": {{"analysis": "<reasoning about whether the user failed to provide requested information it possessed>", "violated": <bool>}},
            "persona_inconsistency": {{"analysis": "<reasoning about whether the user's manner matched the assigned persona>", "violated": <bool>}},
            "protocol_violation": {{"analysis": "<reasoning about whether the user followed its decision-tree and end-of-call instructions>", "violated": <bool>}}
          }},
          "rating": <int: 0 or 1>
        }}
